services:
  ipmonitor:
    image: "alpine:latest"
    restart: unless-stopped # TODO: maybe use "always"?
    volumes:
      - type: bind
        source: ../../temp/ipmonitor
        target: /temp
        read_only: false
        bind:
          create_host_path: true
    env_file:
      - path: ../../.env.base
        required: false
    environment:
      - IPMONITOR_URL=${IPMONITOR_URL}
      - IPMONITOR_INTERVAL=${IPMONITOR_INTERVAL:-120} # seconds
    # TODO: not sure if entrypoint is needed here
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        IPV4_FILE="/temp/ipv4.txt"
        IPV6_FILE="/temp/ipv6.txt" # TODO: add ipv6 support
        IS_HEALTHY_FILE="/tmp/is_healthy.txt"
        IS_RESTARTED_FILE="/tmp/is_restarted.txt"
        IS_RESTARTED="false"
        IS_FIRST_TIME="false"
        if [ -f "$$IS_HEALTHY_FILE" ]; then
          rm "$$IS_HEALTHY_FILE"
        fi
        if [ -f "$$IS_RESTARTED_FILE" ]; then
          if [ "$$(cat "$$IS_RESTARTED_FILE")" = "true" ]; then
            echo "# [DEBUG] is_restarted is true"
            IS_RESTARTED="true"
          fi
          rm "$$IS_RESTARTED_FILE"
        fi

        update_ip() {
          local IS_FIRST_TIME="$$1"
          #echo "# [DEBUG] update_ip(): started"
          if [ -n "$${REAL_IP:-}" ]; then
            echo "# [DEBUG] assuming public IP is static as REAL_IP($$REAL_IP) env is available"
            NEW_IP="$${REAL_IP:-}"
          elif [ -n "$${PUBLIC_IP:-}" ]; then
            echo "# [DEBUG] assuming public IP is static as PUBLIC_IP($$PUBLIC_IP) env is available"
            NEW_IP="$$PUBLIC_IP"
          elif [ -n "$${IPMONITOR_URL:-}" ]; then
            #NEW_IP=$$(curl -s --connect-timeout 5 --max-time 10 "$$IPMONITOR_URL") # curl seems unavailable in busybox
            NEW_IP=$$(wget -q -O- "$$IPMONITOR_URL" || true)
          else
            echo "# [ERROR] non of obtaining public ip is available"
            exit 1
          fi
          if [ -n "$$NEW_IP" ]; then
            # to avoid overrite when its manually changed
            if [ ! -f "$$IS_HEALTHY_FILE" ]; then
              echo "# [DEBUG] ipmonitor is healthy"
              echo "true" >"$$IS_HEALTHY_FILE"
            fi
            if [ -f "$$IPV4_FILE" ] && [ "$$(cat "$$IPV4_FILE")" = "$$NEW_IP" ]; then
              echo "# [INFO] current IP is equal to previous saved IP($$NEW_IP)"
            else
              echo "# [INFO] updating IP to: $$NEW_IP"
              echo "$$NEW_IP" > "$$IPV4_FILE"
              if [ "$$IS_FIRST_TIME" != true ]; then
                echo "# [INFO] exiting to make the service rerun to force dependent services to be restarted"
                exit 0
              else
                echo "# [DEBUG] exiting skipped because IS_FIRST_TIME=true"
              fi
            fi
          else
            echo "# [WARNING] Failed to fetch IP address using $$IPMONITOR_URL"
            if [ "$$IS_FIRST_TIME" = true ]; then
              if [ "$$IS_RESTARTED" != true ]; then
                exit 1
              fi
            fi
          fi
        }
        term_handler() {
            echo "# [INFO] Received SIGTERM/SIGINT. Shutting down gracefully..."
            killall sleep || true
            exit 0
        }
        trap 'term_handler' SIGTERM SIGINT
        while true; do
            # Run sleep in background and wait on its PID.
            # This pattern allows the 'wait' command to be interrupted by signals 
            # much more reliably than a foreground 'sleep' in some shell environments.
            update_ip $$IS_FIRST_TIME
            sleep "$$IPMONITOR_INTERVAL" &
            wait $$!
            # If wait was interrupted by a signal, exit the loop
            if [ $$? -ne 0 ]; then
                break
            fi
            IS_FIRST_TIME="false"
        done
        echo "# [DEBUG] Script exited."
    healthcheck:
      test: ["CMD-SHELL", '[ "$$(cat /tmp/is_healthy.txt || true)" = "true" ] || exit 1']
      start_period: 2s
      interval: 2s
      timeout: 5s
      retries: 10
