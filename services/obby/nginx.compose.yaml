# override nginx container with extra conf and html root
services:
  nginx:
    volumes:
      - type: image
        source: obbyworld/obby:latest
        target: ${OBBY_ROOT:-/srv/http/Obby}.unpatched
        image:
          subpath: usr/share/nginx/html/
      # this is also does not work because "${OBBY_ROOT}" is mounted as read-only and "${OBBY_ROOT}" and docker cannot create the "${OBBY_ROOT}/external" directory to mount tmpfs in it. as a workaround i did redirect "/server.json" to "/etc/obby/servers.json" in nginx.http.domain.conf
      #- type: tmpfs
      #  target: ${OBBY_ROOT:-/srv/http/Obby}/external
      #  tmpfs:
      #    size: 5M
      #    #mode: 0777
      - type: tmpfs
        target: ${OBBY_ROOT:-/srv/http/Obby}
        tmpfs:
          size: 50M
          mode: 0777
      - type: bind
        source: ../obby/nginx.http.domain.conf
        target: /etc/nginx/conf.d/domains/${OBBY_DOMAIN}/obby.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../obby/nginx.entrypoint.sh
        target: /docker-entrypoint.d/obby.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../obby/nginx.envsubst.conf
        target: /etc/envsubst.d/obby.conf
        read_only: true
        bind:
          create_host_path: false
    #env_file:
    #  - path: ../obby/nginx.env
    #    required: true
    environment:
      - OBBY_ROOT=${OBBY_ROOT:-/srv/http/Obby}
