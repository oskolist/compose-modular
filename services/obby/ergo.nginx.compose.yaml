services:
  nginx:
    volumes:
      - type: bind
        source: ../obby/nginx.location.conf
        target: /etc/nginx/conf.d/obby.d/location.d/ergo.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../obby/ergo.server.json
        target: /etc/obby/servers.d/ergo.json.template
        read_only: true
        bind:
          create_host_path: false
    environment:
      - ERGO_NETWORK_NAME
      - ERGO_DESCRIPTION
      - ERGO_DOMAIN
      - ERGO_WS_PORT
      - ERGO_WSS_PORT=${ERGO_WSS_PORT:-${HTTPS_PORT:-443}}
