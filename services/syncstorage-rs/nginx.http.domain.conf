# Firefox Sync: the tokenserver API (/1.0/sync/1.5) and the syncstorage API
# (/1.5/<uid>/) share a single listener, so one proxy_pass covers both.
# Sync BSO payloads can be up to ~2.5MB (SYNC limits default to 2,621,440 / 2,625,536
# bytes), so the body size limit must exceed that — 5m gives comfortable headroom.
client_max_body_size 5m;
location / {
  proxy_pass http://syncstorage-rs:$SYNCSTORAGERS_PORT;
  proxy_http_version 1.1;
  proxy_set_header Host $$http_host;
  proxy_set_header X-Real-IP $$remote_addr;
  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $$scheme;
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
}
