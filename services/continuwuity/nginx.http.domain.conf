add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;
add_header X-XSS-Protection "1; mode=block";
proxy_buffering off;

gzip on;
gzip_types application/json;
gzip_min_length 1000;

location ~ ^(/|/_matrix|/_conduwuit) {
  proxy_pass http://upstream_continuwuity;
  #proxy_pass http://unix:/run/conduwuit/conduwuit.sock;
  # Increase client_max_body_size to match max_request_size defined in conduwuit.toml
  # we can use same value passed to conduwuit(byte). see https://nginx.org/en/docs/syntax.html#size
  client_max_body_size ${CONTINUWUITY_MAX_REQUEST_SIZE};
  proxy_http_version 1.1;
  proxy_set_header Host $$host;
  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $$scheme;
}

