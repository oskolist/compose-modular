include /etc/nginx/map.d/*.conf;
include /etc/nginx/upstream.d/*.conf;

# Logging
# see https://github.com/nginx/docker-nginx/issues/39
access_log off;
## Default
#log_format  main  '$$remote_addr - $$remote_user [$$time_local] "$$request" '
#                  '$$status $$body_bytes_sent "$$http_referer" '
#                  '"$$http_user_agent" "$$http_x_forwarded_for"';
## Custom
#log_format custom '$$status: $$remote_addr';
log_format custom '$$host $$remote_addr - $$remote_user [$$time_local] '
                 '"$$request" $$status $$body_bytes_sent '
                 '"$$http_referer" "$$http_user_agent"';

include /etc/nginx/conf.d/domains/*.conf;
