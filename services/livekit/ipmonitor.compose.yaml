services:
  livekit:
    volumes:
      - type: bind
        source: ../../temp/ipmonitor
        target: /mnt/ipmonitor/temp
        read_only: true
        bind:
          create_host_path: true
    environment:
      LIVEKIT_RTC_USE_EXTERNAL_IP: false
    entrypoint: /bin/sh
    command:
      - -c
      - |
        IP="$$(cat /mnt/ipmonitor/temp/ipv4.txt || true)"
        if [ -n "$$IP" ]; then
          export NODE_IP="$$IP"
          export LIVEKIT_RTC_NODE_IP_IPV4="$$IP"
          echo "# [DEBUG] NODE_IP=LIVEKIT_RTC_NODE_IP_IPV4=$$IP"
        else
          echo "# [WARNING] \$$IP is empty!"
        fi
        exec /livekit-server
    pid: "service:ipmonitor"
    depends_on:
      # https://stackoverflow.com/questions/52322800/docker-compose-how-to-wait-for-other-service-to-be-ready
      ipmonitor:
        condition: service_healthy
