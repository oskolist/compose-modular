services:
  nginx:
    volumes:
      - type: image
        source: ${MAARKDOWNVIEWER_IMAGE_SRC:-ghcr.io/oskolist/maarkdown-viewer-image}:${MAARKDOWNVIEWER_IMAGE_TAG:-latest}${MAARKDOWNVIEWER_IMAGE_DIGEST:-}
        target: ${MAARKDOWNVIEWER_ROOT:-/srv/http/maarkdown-viewer}
        image:
          subpath: usr/share/nginx/html/
      - type: bind
        source: ../maarkdown-viewer/nginx.http.domain.conf
        target: /etc/nginx/conf.d/domains/${MAARKDOWNVIEWER_DOMAIN}/maarkdown-viewer.conf.template
        read_only: true
        bind:
          create_host_path: false
    environment:
      - MAARKDOWNVIEWER_ROOT=${MAARKDOWNVIEWER_ROOT:-/srv/http/maarkdown-viewer}
