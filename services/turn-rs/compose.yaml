# https://github.com/mycrl/turn-rs/blob/main/Dockerfile
services:
  turn-rs:
    image: ${TURNRS_IMAGE_SRC:-ghcr.io/mycrl/turn-server}:${TURNRS_IMAGE_TAG:-latest}${TURNRS_IMAGE_DIGEST:-}
    restart: unless-stopped
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf
      - ./ssl/:/etc/coturn/ssl/
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "10000-20000:10000-20000/udp"
