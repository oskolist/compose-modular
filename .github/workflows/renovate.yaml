name: Renovate
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cp compose.yaml.template compose.yaml
          ./tools/create_uncommented_composeyaml.sh --inplace -- compose.yaml
      - uses: renovatebot/github-action@v46.3.7
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
